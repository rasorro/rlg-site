name: Static Site Checks

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint source
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Check export (canonicals, sitemap, cache rules, Unity build files)
        run: node scripts/check-export.mjs

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"

      - name: Lint and test PHP
        run: |
          for f in public/api/*.php; do php -l "$f"; done
          php scripts/test-score-signature.php
